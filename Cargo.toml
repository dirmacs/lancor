[package]
name = "lancor"
version = "0.2.0"
edition = "2021"
authors = ["dirmacs <contact@dirmacs.com>"]
description = "End-to-end llama.cpp toolkit: API client, HuggingFace Hub, server orchestration, benchmarks"
readme = "README.md"
homepage = "https://github.com/dirmacs/lancor"
repository = "https://github.com/dirmacs/lancor"
license = "GPL-3.0"
keywords = ["llama", "llm", "ai", "openai", "api"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
anyhow = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "6"
which = "7"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
